name: Nightly release

on:
  push:
    branches:
      - beta
    paths-ignore:
      - '**.md'
  # 1. Added manual trigger (The "Button")
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Ubuntu (x86_64)
            install: sudo apt-get update && sudo apt-get install -y libasound2-dev libgl-dev libglu1-mesa-dev libgtk-3-dev libjack-dev libmad0-dev libpulse-dev libudev-dev libxinerama-dev libx11-dev libxrandr-dev libxtst-dev nasm
            release: |
              cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_FULL_RELEASE=Off -DWITH_NIGHTLY_RELEASE=On -DWITH_CLUB_FANTASTIC=Off
              cmake --build build --target package
            path: build/ITGmania-*-NIGHTLY-git-*-Linux-x86_64-no-songs.tar.gz

          # 2. Optimized specifically for Raspberry Pi 5 / Trixie
          - os: ubuntu-24.04-arm
            name: Raspberry Pi 5 (ARM64)
            # Removed 'nasm' (it's x86 only). Added 'libva-dev' and 'libjpeg-dev' for better FFmpeg/Asset support.
            install: |
              sudo apt-get update
              sudo apt-get install -y libasound2-dev libgl-dev libglu1-mesa-dev libgtk-3-dev libjack-dev libmad0-dev libpulse-dev libudev-dev libxinerama-dev libx11-dev libxrandr-dev libxtst-dev libva-dev libjpeg-dev
            release: |
              # Added -mcpu=cortex-a76 to optimize for the Pi 5's specific processor
              cmake -B build -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_C_FLAGS="-mcpu=cortex-a76" \
                -DCMAKE_CXX_FLAGS="-mcpu=cortex-a76" \
                -DWITH_FULL_RELEASE=Off \
                -DWITH_NIGHTLY_RELEASE=On \
                -DWITH_CLUB_FANTASTIC=Off \
                -DWITH_MINIMAID=Off
              cmake --build build --target package
            path: build/ITGmania-*-NIGHTLY-git-*-Linux-aarch64-no-songs.tar.gz

          - os: macos-latest
            name: macOS (M1)
            install: brew install nasm
            release: |
              cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_FULL_RELEASE=Off -DWITH_NIGHTLY_RELEASE=On -DCMAKE_OSX_ARCHITECTURES=arm64 -DWITH_CLUB_FANTASTIC=Off
              cmake --build build --target package
            path: build/ITGmania-*-NIGHTLY-git-*-macOS-M1-no-songs.dmg

          - os: windows-latest
            name: Windows
            release: |
              cmake -B build -DWITH_FULL_RELEASE=Off -DWITH_NIGHTLY_RELEASE=On -DWITH_CLUB_FANTASTIC=Off
              cmake --build build --config Release --target package
            path: build/ITGmania-*-NIGHTLY-git-*-Windows-no-songs.exe

    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache CMake build directory
        uses: actions/cache@v4
        with:
          path: |
            build/*
            !${{ matrix.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-cmake-build-nightly-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cmake-build-nightly-

      - name: Install dependencies
        if: matrix.os != 'windows-latest'
        run: ${{ matrix.install }}

      - name: Add msbuild to PATH
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Create release
        run: ${{ matrix.release }}

      - name: Upload artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ITGmania-${{ github.sha }}-${{ matrix.name }}
          path: ${{ matrix.path }}
          compression-level: 0

      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ITGmania-${{ github.sha }}-${{ matrix.name }}
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}
